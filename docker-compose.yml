name: stable-diffusion-webui

services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: stable-diffusion-webui:local
    container_name: stable-diffusion-webui
    restart: unless-stopped

    # Bound to loopback only - nginx is the way in from anywhere else. Drop the
    # 127.0.0.1 prefix if you want plain HTTP on the LAN as well.
    ports:
      - "127.0.0.1:${WEBUI_PORT:-7860}:7860"

    env_file:
      - .env

    volumes:
      # Everything you care about: models, outputs, extensions, embeddings,
      # config.json, ui-config.json, styles.csv. Drop checkpoints straight into
      # ./data/models/Stable-diffusion from Explorer.
      - ./data:/data
      # Pre-populated from the image on first run, then persisted so the pinned
      # repos are never re-cloned.
      - sd-repositories:/app/repositories
      - sd-config-states:/app/config_states
      # pip / HuggingFace / CLIP downloads.
      - sd-cache:/root/.cache

    # For local iteration, mount the source over the image copy so code edits
    # need only a container restart instead of a rebuild:
    #   - ./modules:/app/modules
    #   - ./scripts:/app/scripts
    #   - ./extensions-builtin:/app/extensions-builtin

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # PyTorch is unhappy with the 64MB default.
    shm_size: "2gb"
    stop_grace_period: 30s

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7860/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First boot may download a model; don't flap while that happens.
      start_period: 600s

  # TLS front end. Terminates HTTPS and proxies to webui over the internal
  # compose network, so the WebUI itself never speaks TLS.
  nginx:
    build:
      context: ./docker/nginx
    image: stable-diffusion-webui-nginx:local
    container_name: stable-diffusion-webui-nginx
    restart: unless-stopped

    # Start order only, not readiness: nginx returning 502 for the first minute
    # while the WebUI loads a model is better than nginx refusing to start.
    depends_on:
      - webui

    ports:
      - "${HTTPS_PORT:-8443}:443"

    volumes:
      - ${NGINX_CONF:-./docker/nginx/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      # Self-signed cert is generated here on first boot. Drop real fullchain.pem
      # / privkey.pem in to use a CA-issued one instead.
      - ./certs:/etc/nginx/certs

    environment:
      TLS_COMMON_NAME: "${TLS_COMMON_NAME:-localhost}"
      TLS_SAN: "${TLS_SAN:-DNS:localhost,IP:127.0.0.1}"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  sd-repositories:
  sd-config-states:
  sd-cache:
