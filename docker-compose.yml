services:
  stable-diffusion-webui:
    container_name: "framepack-studio"
    build:
      context: .
      dockerfile: Dockerfile
      # Uncomment to move the whole CUDA/torch stack forward. See the header
      # comment in the Dockerfile -- these three must be bumped together.
      # args:
      #   CUDA_IMAGE: nvidia/cuda:12.4.1-runtime-ubuntu22.04
      #   TORCH_COMMAND: "pip install torch==2.6.0 torchvision==0.21.0 --extra-index-url https://download.pytorch.org/whl/cu124"
      #   XFORMERS_PACKAGE: xformers==0.0.29.post3
    # Appended to the ENTRYPOINT flags (--data-dir /data --listen --port 7860 --xformers).
    command: --no-half --no-half-vae --precision full
    runtime: nvidia
    restart: unless-stopped
    ports:
      - 7860:7860
    # /dev/shm defaults to 64MB in containers, which torch dataloaders and the
    # interrogators can exhaust.
    shm_size: "2gb"
    volumes:
      # Single --data-dir mount. Everything the webui writes or downloads lives
      # here: models/, extensions/, embeddings/, outputs/, inputs/, config.json,
      # ui-config.json, styles.csv, cache.json.
      - ./.data:/data
      # HuggingFace / torch.hub / CLIP download caches. A named volume so it is
      # seeded with the image's ownership -- without this the CLIP text encoder
      # (~2GB) is re-downloaded every time the container is recreated.
      - sd-cache:/app/.cache
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      mode: global
      placement:
        constraints:
          - "node.labels.iface != extern"
      restart_policy:
        condition: unless-stopped
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  sd-cache:
